function render(m,o){
 const ns=Object.fromEntries(m.nodes.map(n=>[n.id,n])),dn=new Set(),de=new Set();
 if(o.dim){let q=[...o.targets],seen=new Set(q);while(q.length){const id=q.shift();m.edges.forEach((e,i)=>{if(!e.feedback&&(e.a===id||e.via===id)){de.add(i);if(!o.targets.includes(e.b))dn.add(e.b);if(!seen.has(e.b)){seen.add(e.b);q.push(e.b)}}})}}

 m.nodes.forEach(n=>{if(n.drugOnly&&(o.kind==='normal'||(m.slug==='02-05-Nucleic-acids'&&!o.targets.includes('red'))))return;s+=`<g class="${dn.has(n.id)?'dimmed':''}">`+txt(n.x,n.y,n.t,18)+(n.sub?txt(n.x,n.y+22,(m.slug==='02-05-Nucleic-acids'&&n.id==='damage'&&o.name==='Metronidazole')?'DNA damage':n.sub,13):'')+'</g>'});
 const placements=o.targets.map((id,i)=>{let n=ns[id];return o.pos[i]||[n.x,n.y-95]});
 const shared=o.targets.length>1&&placements.every(p=>p[1]===placements[0][1])&&o.targets.every(id=>ns[id].y===ns[o.targets[0]].y);
 if(shared){const y=placements[0][1],xs=o.targets.map(id=>ns[id].x),x=(Math.min(...xs)+Math.max(...xs))/2,n=ns[o.targets[0]],below=y>n.y,sy=below?y-21:y+(o.sub?35:15),ty=below?n.y+(n.sub?38:18):n.y-23,branch=(sy+ty)/2;s+=txt(x,y,o.name,18,'drug-name')+(o.sub?txt(x,y+22,o.sub,13):'');s+=`<path class="${o.kind}" d="M${x} ${sy}V${branch}M${Math.min(...xs)} ${branch}H${Math.max(...xs)}"/>`;xs.forEach(xx=>s+=path(`M${xx} ${branch}V${ty}`,o.kind));}
 o.targets.forEach((id,i)=>{if(shared)return;const n=ns[id];let x=n.x,y=n.y-95;if(o.pos[i])[x,y]=o.pos[i];

 s+=txt(x,y,o.name,18,'drug-name')+(o.sub?txt(x,y+22,o.sub,13):'')+path(d,o.kind);
 });
 if(m.slug==='04-01-HPA'&&o.kind==='promote')s+=path('M845 345H935V65H330V100','inhibit')+path('M845 345H885V295H440','inhibit')+txt(820,85,'Chronic negative feedback',13,'red');

 return `<svg class="map" viewBox="0 0 1000 ${m.h}" role="img" aria-label="${esc(m.title+' — '+o.name)}">${s}</svg>`;
}
